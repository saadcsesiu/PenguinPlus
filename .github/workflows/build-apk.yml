name: Build & Release Penguin Plus APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -r | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            mkdir -p "$SDK_ROOT/licenses"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required release signing secrets. Add RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > my-upload-key.jks

      - name: Create .env from GitHub Secrets
        env:
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
        run: |
          : > .env
          if [ -n "$GOOGLE_APPS_SCRIPT_URL" ]; then
            printf 'GOOGLE_APPS_SCRIPT_URL=%s\n' "$GOOGLE_APPS_SCRIPT_URL" >> .env
          fi

      - name: Build Signed Release APK & AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Clean Up Sensitive Build Files
        if: always()
        run: rm -f my-upload-key.jks .env

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenguinPlus-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenguinPlus-Release-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: Penguin Plus+ Global Release
          body: |
            # Penguin Plus+ Global Release — v1.0.0

            Initial global release of Penguin Plus+ for Android.

            - First public release
            - Signed Android APK distribution
            - Download and install on compatible Android devices

            Thank you for using Penguin Plus+!
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
