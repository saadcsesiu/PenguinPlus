name: Build & Release Penguin Plus APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -r | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            mkdir -p "$SDK_ROOT/licenses"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Create .env from GitHub Secrets
        env:
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          SECRET_REDEEM_EMAIL: ${{ secrets.SECRET_REDEEM_EMAIL }}
          SECRET_REDEEM_CODE: ${{ secrets.SECRET_REDEEM_CODE }}
        run: |
          : > .env
          if [ -n "$GOOGLE_APPS_SCRIPT_URL" ]; then
            printf 'GOOGLE_APPS_SCRIPT_URL=%s\n' "$GOOGLE_APPS_SCRIPT_URL" >> .env
          fi
          if [ -n "$SECRET_REDEEM_EMAIL" ]; then
            printf 'SECRET_REDEEM_EMAIL=%s\n' "$SECRET_REDEEM_EMAIL" >> .env
          fi
          if [ -n "$SECRET_REDEEM_CODE" ]; then
            printf 'SECRET_REDEEM_CODE=%s\n' "$SECRET_REDEEM_CODE" >> .env
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenguinPlus-APK
          path: app/build/outputs/apk/debug/*.apk
