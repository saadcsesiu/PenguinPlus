name: Build & Release Penguin Plus APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create .env from GitHub Secrets
        env:
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          SECRET_REDEEM_EMAIL: ${{ secrets.SECRET_REDEEM_EMAIL }}
          SECRET_REDEEM_CODE: ${{ secrets.SECRET_REDEEM_CODE }}
        run: |
          : > .env
          if [ -n "$GOOGLE_APPS_SCRIPT_URL" ]; then
            echo "GOOGLE_APPS_SCRIPT_URL=$GOOGLE_APPS_SCRIPT_URL" >> .env
          fi
          if [ -n "$SECRET_REDEEM_EMAIL" ]; then
            echo "SECRET_REDEEM_EMAIL=$SECRET_REDEEM_EMAIL" >> .env
          fi
          if [ -n "$SECRET_REDEEM_CODE" ]; then
            echo "SECRET_REDEEM_CODE=$SECRET_REDEEM_CODE" >> .env
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenguinPlus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
